# NextBSD -- the rolling Desktop Preview snapshot, arm64/aarch64, INSTALLED
# from the upstream live ISO.
#
# The Desktop counterpart of conf/nextbsd-continuous-aarch64.conf; see
# conf/nextbsd-continuous-desktop.conf for what the Desktop variant changes
# (nothing in the build -- only the upstream tag and asset).
VM_NEXTBSD_REPO="nextbsd/nextbsd"
VM_NEXTBSD_TAG="continuous-desktop"
VM_NEXTBSD_ASSET_PREFIX="NextBSD-Desktop-arm64-"
VM_NEXTBSD_ASSET_SUFFIX=".iso"

VM_OS_NAME="nextbsd"
VM_RELEASE=continuous-desktop
VM_ARCH="aarch64"
VM_SSH_PORT=2222

VM_LOGIN_TAG="login:"

VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# halt(8) -> reboot(2) RB_POWEROFF; launchd ignores shutdown(8)'s signals.
VM_SHUTDOWN_CMD="/sbin/halt -p"

# FreeBSD ports through the ABI pin in hooks/vm_postBuild.sh.
VM_INSTALL_CMD="pkg install -y "

VM_RSYNC_PKG="rsync"

# No VM_SSHFS_PKG: no fusefs module can load (NO_MODULES kernel, no kldload).
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG"

VM_SYNC_METHODS="rsync,scp,nfs,tar"
