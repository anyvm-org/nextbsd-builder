# NextBSD -- the rolling Server Preview snapshot, arm64/aarch64, INSTALLED
# from the upstream live ISO.
#
# Everything that makes this guest unusual is arch-independent and documented
# in conf/nextbsd-continuous.conf, hooks/host_installOpts.py and
# hooks/vm_postBuild.sh: launchd is PID 1 (no rc.conf / rc.d / sysrc /
# service(8)), root ssh needs no credential, and the image is installed by
# upstream's installer engine driven over the serial console.
#
# Differences from amd64, none of which needs a knob here:
#   * firmware: build.py's aarch64 branch always boots EDK2 from pflash, and
#     the loader's efi console is on the serial line there too -- no VM_BIOS;
#   * the install medium is attached the way build.py attaches every aarch64
#     ISO, and probe-disks.sh flags it as the install medium, so the target
#     is still picked by that flag, not by a device name;
#   * the serial console written by vm_postBuild.sh lists vidconsole too,
#     which arm64 simply ignores.
#
# Upstream also publishes NextBSD-Server-rpi5-<stamp>.img.zip on the same tag,
# a Raspberry Pi 5 image. It is not built here -- QEMU has no raspi5 machine
# -- and hooks/host_beforeBuild.py can never pick it: it requires the build
# stamp to follow the "NextBSD-Server-arm64-" prefix directly.
VM_NEXTBSD_REPO="nextbsd/nextbsd"
VM_NEXTBSD_TAG="continuous-server"
VM_NEXTBSD_ASSET_PREFIX="NextBSD-Server-arm64-"
VM_NEXTBSD_ASSET_SUFFIX=".iso"

VM_OS_NAME="nextbsd"
VM_RELEASE=continuous
VM_ARCH="aarch64"
VM_SSH_PORT=2222

# See conf/nextbsd-continuous.conf: login: shows on the serial line from the
# second boot on; the first boot is gated on sshd by
# hooks/host_waitForLoginTag.py.
VM_LOGIN_TAG="login:"

VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# halt(8) -> reboot(2) RB_POWEROFF; launchd ignores shutdown(8)'s signals.
VM_SHUTDOWN_CMD="/sbin/halt -p"

# FreeBSD ports through the ABI pin in hooks/vm_postBuild.sh (FreeBSD:15:aarch64).
VM_INSTALL_CMD="pkg install -y "

VM_RSYNC_PKG="rsync"

# No VM_SSHFS_PKG: no fusefs module can load (NO_MODULES kernel, no kldload).
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG"

VM_SYNC_METHODS="rsync,scp,nfs,tar"
