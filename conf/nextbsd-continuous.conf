# NextBSD -- the rolling Server Preview snapshot, amd64, INSTALLED from the
# upstream live ISO.
#
# NextBSD (https://nextbsd.org, github.com/nextbsd/nextbsd) runs a FreeBSD
# kernel -- rebranded, `uname -s` says NextBSD -- under Darwin's system
# plumbing: launchd(8) is PID 1, services are .plist files under
# /System/Library/LaunchDaemons/, and there is NO rc(8) at all: no
# /etc/rc.conf, no /etc/rc.d, no sysrc(8), no service(8). Anything that
# would be `sysrc foo_enable=YES` on FreeBSD is a launchd job here, so the
# freebsd-builder hooks do not carry over -- see hooks/vm_postBuild.sh.
#
# Upstream publishes NO versioned releases. Each build REPLACES the assets
# of a rolling prerelease tag, and the asset names carry that build's stamp
# (NextBSD-Server-amd64-27.0.0-192.iso), so the download URL cannot be
# written down here: hooks/host_beforeBuild.py resolves the current asset
# through the GitHub releases API and sets VM_ISO_LINK. What pins the
# snapshot an anyvm user gets is this BUILDER's release tag, not the
# upstream URL.
#
# Since 2026-11-25 there are two such tags, continuous-server and
# continuous-desktop (the old single `continuous` tag is gone), and both
# ship only live ISOs for amd64/arm64 -- no disk image any more. So this
# image is installed: hooks/host_installOpts.py drives upstream's installer
# engine over the serial console. The release name stays `continuous` so
# `anyvm --os nextbsd --release continuous` keeps meaning the Server
# snapshot; the Desktop variant is conf/nextbsd-continuous-desktop.conf.
VM_NEXTBSD_REPO="nextbsd/nextbsd"
VM_NEXTBSD_TAG="continuous-server"
VM_NEXTBSD_ASSET_PREFIX="NextBSD-Server-amd64-"
VM_NEXTBSD_ASSET_SUFFIX=".iso"

VM_OS_NAME="nextbsd"
VM_RELEASE=continuous
VM_SSH_PORT=2222

# UEFI. The install needs it: only under OVMF is the loader on the serial
# line, where hooks/host_installOpts.py stops its countdown and sets the
# serial console. The INSTALLED disk boots either way (checked on
# 27.0.0-192): the ESP carries the removable-media fallback loader
# (EFI/BOOT/BOOTX64.EFI), so a fresh OVMF with no NVRAM entry finds it, and
# the installer also writes gptzfsboot into the freebsd-boot partition, so
# SeaBIOS -- anyvm's default on x86_64 -- boots it too.
# hooks/host_beforeBuild.py installs ovmf if this file is missing.
VM_BIOS="/usr/share/ovmf/OVMF.fd"

# The installed system boots with upstream's loader.conf, which sets no
# console, so the first boot prints nothing on the serial line until
# hooks/vm_postBuild.sh persists /boot/loader.conf.d/anyvm.conf. That is
# why hooks/host_waitForLoginTag.py waits for sshd instead of this tag on
# that boot. Every later boot shows getty's login: on the serial line
# (org.nextbsd.getty runs on the console once the kernel console includes
# comconsole). launchd starts com.openssh.sshd at boot, and upstream's
# sshd_config (PermitRootLogin yes) plus its pam_permit /etc/pam.d/sshd let
# root in over the slirp hostfwd with no credential -- the account itself
# is `*`-locked, which pam_permit never looks at. hooks/host_enablessh.py
# relies on exactly that.
VM_LOGIN_TAG="login:"

# Serial-driven build: no VNC/OCR stage is needed (nothing is ever typed at
# the framebuffer), and the serial log is the build transcript. The x86
# branch of build_qemu_args adds -vga + -display vnc regardless, so the web
# console still works for manual debugging.
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# `shutdown -p now` signals PID 1, which here is launchd, not init(8) -- it
# has no SIGINT/SIGTERM reboot protocol. halt(8) calls reboot(2) directly
# with RB_POWEROFF, so QEMU actually powers off. This is what upstream's own
# tests use as the fallback.
VM_SHUTDOWN_CMD="/sbin/halt -p"

# pkg(8) is in the base system, but upstream ships only its own repository
# (NextBSD-* meta packages, no ports) and its pkg computes the ABI
# NextBSD:27:amd64, which refuses FreeBSD packages. hooks/vm_postBuild.sh
# therefore pins ABI = "FreeBSD:15:amd64" in /private/etc/pkg.conf and makes
# the signed FreeBSD ports repository the package source, so this plain
# command -- and a user's `pkg install` -- installs FreeBSD ports.
VM_INSTALL_CMD="pkg install -y "

VM_RSYNC_PKG="rsync"

# No VM_SSHFS_PKG on purpose. fusefs-sshfs needs the fusefs kernel module,
# and this image cannot load one: the NEXTBSD kernel is built NO_MODULES and
# upstream deletes the kld* CLIs from the image outright (kldload/kldunload/
# kldstat are gone; Darwin's kextload/kextstat replace them and only handle
# kext bundles). Revisit if a fusefs kext ever ships.
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG"

# No VM_OPTS / VM_ROOT_PASSWORD: the installer is driven by
# hooks/host_installOpts.py, and root has no usable password (`*`) -- the
# pam_permit ssh stack is what lets the build in.

# Verified sync methods -- see .github/data/table.md. rsync comes from the
# ports repo; scp is always available through the same sshd; nfs needs the
# /etc/netconfig RPC table, which upstream now ships (hooks/vm_postBuild.sh
# still installs it if a snapshot lacks it).
VM_SYNC_METHODS="rsync,scp,nfs,tar"
