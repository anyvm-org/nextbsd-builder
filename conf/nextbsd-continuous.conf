# NextBSD -- the rolling "continuous" snapshot, amd64, built from the
# upstream prebuilt GPT disk image (no installer exists yet).
#
# NextBSD (https://nextbsd.org, github.com/nextbsd-redux) runs a FreeBSD
# kernel -- rebranded, `uname -s` says NextBSD -- under Darwin's system
# plumbing: launchd(8) is PID 1, services are .plist files under
# /System/Library/LaunchDaemons/, and there is NO rc(8) at all: no
# /etc/rc.conf, no /etc/rc.d, no sysrc(8), no service(8). Anything that
# would be `sysrc foo_enable=YES` on FreeBSD is a launchd job here, so the
# freebsd-builder hooks do not carry over -- see hooks/vm_postBuild.sh.
#
# Upstream publishes NO versioned releases. A single rolling `continuous`
# tag is refreshed on every push to main and its assets carry the build
# timestamp (NextBSD-amd64-20260724-211803.img.zip), so the download URL
# cannot be written down here: hooks/host_beforeBuild.py resolves the
# current asset through the GitHub releases API and sets VM_VHD_LINK.
# What pins the snapshot an anyvm user gets is this BUILDER's release tag,
# not the upstream URL.
VM_NEXTBSD_REPO="nextbsd-redux/nextbsd"
VM_NEXTBSD_TAG="continuous"
VM_NEXTBSD_ASSET_SUFFIX=".img.zip"

VM_OS_NAME="nextbsd"
VM_RELEASE=continuous
VM_SSH_PORT=2222

# The shipped image already runs sshd from boot: launchd starts
# com.openssh.sshd (RunAtLoad + KeepAlive) via /usr/libexec/sshd-keygen-wrapper,
# which generates the host keys on first boot. Its /etc/ssh/sshd_config has
# PermitRootLogin yes + PubkeyAuthentication yes, and /etc/pam.d/sshd is
# pam_permit, so root gets in over the slirp hostfwd with no credential at
# all. hooks/host_enablessh.py therefore pipes enablessh.local straight over
# ssh instead of typing it at the console (the generic console path needs
# nc(1) in the guest and a login prompt on the serial line -- see below).
#
# The image's loader.conf sets no console, so the KERNEL talks to vidconsole
# only and the serial line stays silent until hooks/vm_postBuild.sh persists
# /boot/loader.conf.d/anyvm.conf. That is why the login prompt cannot be
# waited for on boot 1 -- hooks/host_waitForLoginTag.py waits for sshd to
# answer instead. VM_LOGIN_TAG is still the right tag for every later boot.
VM_LOGIN_TAG="login:"

# Serial-driven build: no VNC/OCR stage is needed (nothing is ever typed at
# the framebuffer), and the serial log is the build transcript from boot 2
# on. The x86 branch of build_qemu_args adds -vga + -display vnc regardless,
# so the web console still works for manual debugging.
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# `shutdown -p now` signals PID 1, which here is launchd, not init(8) -- it
# has no SIGINT/SIGTERM reboot protocol. halt(8) calls reboot(2) directly
# with RB_POWEROFF, so QEMU actually powers off. This is what upstream's own
# tests/img-boot-test.sh uses.
VM_SHUTDOWN_CMD="/sbin/halt -p"

# pkg(8) is baked into the image and pre-configured for the FreeBSD ports
# repo: /usr/local/etc/pkg/repos/FreeBSD.conf points at
# pkg.FreeBSD.org/FreeBSD:15:amd64/latest and /usr/local/etc/pkg.conf pins
# ABI=FreeBSD:15:amd64 + IGNORE_OSVERSION (NextBSD rebrands the ABI, so the
# pin is load-bearing).
VM_INSTALL_CMD="pkg install -y "

VM_RSYNC_PKG="rsync"

# No VM_SSHFS_PKG on purpose. fusefs-sshfs needs the fusefs kernel module,
# and this image cannot load one: the NEXTBSD kernel is built NO_MODULES and
# upstream deletes the kld* CLIs from the image outright (kldload/kldunload/
# kldstat are gone; Darwin's kextload/kextstat replace them and only handle
# kext bundles). Revisit if a fusefs kext ever ships.
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG"

# No VM_OPTS / VM_ROOT_PASSWORD: there is no installer to answer, and root
# ships with an empty password (master.passwd line `root::0:0:...`), which
# is what the console login and the pam_permit ssh stack both expect.

# Verified sync methods -- see .github/data/table.md. rsync comes from the
# ports repo; scp is always available through the same sshd; nfs works only
# because hooks/vm_postBuild.sh installs /etc/netconfig (without it every
# mount dies with "tcp: Netconfig database not found").
VM_SYNC_METHODS="rsync,scp,nfs"
