# NextBSD -- the rolling Desktop Preview snapshot, amd64, INSTALLED from the
# upstream live ISO.
#
# Same build as conf/nextbsd-continuous.conf (read that one first): only the
# upstream tag and asset differ. The Desktop ISO carries the graphical
# session (WindowServer + loginwindow on the framebuffer) on top of the same
# base system, and installs the same way -- hooks/host_installOpts.py drives
# the installer engine on the serial console, where the live system
# auto-logs in as admin just as the Server ISO does.
#
# On the installed system the desktop runs on the framebuffer (the anyvm
# VNC/web console), while ssh, the serial console and every sync method work
# exactly as on the Server image. org.nextbsd.getty puts getty on the
# console as soon as the kernel console includes comconsole, which
# hooks/vm_postBuild.sh sets, so the serial line is not taken over by the
# graphical login.
#
# .github/data/table.notes.md lists this tag under desktop-table:, which
# puts it in the desktop table (base release "continuous", variant
# "desktop").
VM_NEXTBSD_REPO="nextbsd/nextbsd"
VM_NEXTBSD_TAG="continuous-desktop"
VM_NEXTBSD_ASSET_PREFIX="NextBSD-Desktop-amd64-"
VM_NEXTBSD_ASSET_SUFFIX=".iso"

VM_OS_NAME="nextbsd"
VM_RELEASE=continuous-desktop
VM_SSH_PORT=2222

# UEFI for the install -- see conf/nextbsd-continuous.conf.
VM_BIOS="/usr/share/ovmf/OVMF.fd"

VM_LOGIN_TAG="login:"

VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

# halt(8) -> reboot(2) RB_POWEROFF; launchd ignores shutdown(8)'s signals.
VM_SHUTDOWN_CMD="/sbin/halt -p"

# FreeBSD ports through the ABI pin in hooks/vm_postBuild.sh.
VM_INSTALL_CMD="pkg install -y "

VM_RSYNC_PKG="rsync"

# No VM_SSHFS_PKG: no fusefs module can load (NO_MODULES kernel, no kldload).
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG"

VM_SYNC_METHODS="rsync,scp,nfs,tar"
