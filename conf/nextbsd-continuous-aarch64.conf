# NextBSD -- the rolling "continuous" snapshot, arm64/aarch64, built from the
# upstream prebuilt GPT disk image (no installer exists yet).
#
# Upstream started publishing an arm64 image next to amd64 on the same rolling
# tag on 2026-08-14 (NextBSD-arm64-20260814-222541.img.zip). Everything that
# makes this guest unusual is arch-independent and documented in
# conf/nextbsd-continuous.conf and hooks/vm_postBuild.sh: launchd is PID 1 (no
# rc.conf / rc.d / sysrc / service(8)), root ssh needs no credential, the root
# filesystem must be grown at build time, and /etc/netconfig has to be baked in
# before NFS works. Verified on this image, not assumed -- the arm64 snapshot
# ships the same curated /etc (no netconfig, no kldload) and the same
# pam_permit sshd stack.
#
# Two things ARE different, and neither needs a knob here:
#   * the disk has 2 partitions (efi + freebsd-ufs) where amd64 has 3, so the
#     growfs step in vm_postBuild.sh resizes vtbd0p2 -- it derives the index
#     from `gpart show` rather than hardcoding it, exactly for this;
#   * the root is even smaller (2.1G with 1.4G free), which is why growing it
#     is not optional: 196G / 180G free after.
# The serial console needs no arch branch either: /boot/loader.conf.d/anyvm.conf
# written by vm_postBuild.sh was re-tested on `virt` and the kernel, launchd and
# getty all still reach the serial line after it (the x86-only `vidconsole` in
# the console list is simply ignored on arm64).
#
# The prefix is NOT the whole selector: since 2026-08-25 the same tag also
# carries NextBSD-arm64-rpi5-<timestamp>.img.zip, a Raspberry Pi 5 image that
# shares this prefix and this suffix. hooks/host_beforeBuild.py therefore
# requires the build timestamp to follow the prefix directly, which excludes
# every board-specific variant without naming any of them. The rpi5 image is
# not built here at all -- QEMU has no raspi5 machine (8.2.2, what CI
# installs, stops at raspi3b).
VM_NEXTBSD_REPO="nextbsd-redux/nextbsd"
VM_NEXTBSD_TAG="continuous"
VM_NEXTBSD_ASSET_PREFIX="NextBSD-arm64-"
VM_NEXTBSD_ASSET_SUFFIX=".img.zip"

VM_OS_NAME="nextbsd"
VM_RELEASE=continuous
VM_ARCH="aarch64"
VM_SSH_PORT=2222

VM_LOGIN_TAG="login:"

VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

VM_SHUTDOWN_CMD="/sbin/halt -p"

# pkg(8) is baked in and already pinned to the aarch64 ABI: the image's
# /usr/local/etc/pkg.conf carries ABI = "FreeBSD:15:aarch64" + IGNORE_OSVERSION
# and /usr/local/etc/pkg/repos/FreeBSD.conf points at
# pkg.FreeBSD.org/FreeBSD:15:aarch64/latest, so the install command is the
# same as amd64's.
VM_INSTALL_CMD="pkg install -y "

VM_RSYNC_PKG="rsync"

# No VM_SSHFS_PKG -- same reason as amd64: the NEXTBSD kernel is NO_MODULES and
# the image ships no kldload (verified absent on this arm64 image too), so
# fusefs can never be loaded.
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG"

VM_SYNC_METHODS="rsync,scp,nfs,tar"
